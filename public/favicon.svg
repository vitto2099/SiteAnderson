<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172C" />
      <stop offset="100%" stop-color="#134074" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  
  <!-- Architectural House Silhouette -->
  <path d="M256 96 L416 232 H368 V392 H144 V232 H96 Z" fill="#FFFFFF" fill-opacity="0.1" />
  
  <!-- Golden Roof Accent -->
  <path d="M256 120 L390 234 H350 V376 H162 V234 H122 Z" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Stylized Monogram "AK" -->
  <text x="256" y="325" font-family="'Outfit', sans-serif, system-ui" font-size="140" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">AK</text>
  
  <!-- Crimson Point Accent -->
  <circle cx="340" cy="315" r="16" fill="#C81D25" />
</svg>
